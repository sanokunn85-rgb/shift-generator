
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f7fb">
<title>シフト希望作成</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182230;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;padding:max(16px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
main{max-width:600px;margin:auto}
h1{font-size:25px;margin:8px 0 5px}
.sub{color:#667085;font-size:14px;margin:0 0 18px}
.panel{background:white;border:1px solid #e4e7ec;border-radius:18px;padding:14px;margin-bottom:14px}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:16px}
.month-nav h2{font-size:18px;margin:0;text-align:center;flex:1}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav-btn,.secondary{border:1px solid #d0d5dd;background:white;border-radius:12px;padding:10px;color:#344054;font-size:14px}
.options{display:grid;gap:9px}
.option{display:flex;align-items:center;gap:10px;border:1px solid #d0d5dd;border-radius:12px;padding:12px}
.option:has(input:checked){border-color:#2563eb;background:#eff6ff}
.option input{width:18px;height:18px;accent-color:#2563eb}
.option-label{flex:1}
.delete-shift{border:1px solid #fda29b;background:#fff5f5;color:#b42318;border-radius:8px;padding:6px 8px;font-size:12px}
.custom-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.custom-form label{display:grid;gap:5px;font-size:13px;color:#344054}
.custom-form input[type=time]{width:100%;min-width:0;border:1px solid #d0d5dd;border-radius:10px;padding:10px;font:inherit;background:white}
.custom-form .full{grid-column:1/-1}
.checkline{display:flex!important;grid-template-columns:auto 1fr!important;align-items:center;gap:8px!important}
.checkline input{width:18px;height:18px}
.save-note{font-size:12px;color:#027a48;margin:8px 0 0}
.hint,.status{color:#667085;font-size:12px;line-height:1.5}
.total-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px;margin-top:12px}
.total-label{font-size:13px;color:#166534;margin:0 0 4px}
.total-hours{font-size:25px;font-weight:750;color:#166534;margin:0}
.total-detail{font-size:12px;color:#166534;margin:5px 0 0}
.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.weekdays{margin-bottom:7px;text-align:center;color:#667085;font-size:12px}
.day{min-width:0;min-height:60px;border:1px solid #e4e7ec;border-radius:10px;background:white;padding:5px 1px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;color:#344054}
.day .num{font-size:14px;font-weight:600}
.day .mark{font-size:9px;line-height:1.2;text-align:center}
.day.long{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
.day.morning{background:#dcfce7;border-color:#86efac;color:#166534}
.day.afternoon{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.day.earlylong{background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8}
.day.evening{background:#fce7f3;border-color:#f9a8d4;color:#9d174d}
.day.morning5{background:#ccfbf1;border-color:#5eead4;color:#115e59}
.day.morning3{background:#e0e7ff;border-color:#a5b4fc;color:#3730a3}
.day.saturday .num{color:#2563eb}
.day.sunday .num,.day.holiday .num{color:#dc2626}
.day.saturday:not(.long):not(.morning):not(.afternoon):not(.earlylong):not(.evening):not(.morning5):not(.morning3):not(.custom){background:#eff6ff;border-color:#bfdbfe}
.day.sunday:not(.long):not(.morning):not(.afternoon):not(.earlylong):not(.evening):not(.morning5):not(.morning3):not(.custom),
.day.holiday:not(.long):not(.morning):not(.afternoon):not(.earlylong):not(.evening):not(.morning5):not(.morning3):not(.custom){background:#fef2f2;border-color:#fecaca}
.day.empty{visibility:hidden}
.actions{display:grid;gap:9px}
.primary{background:#2563eb;color:white;border:0;border-radius:13px;padding:14px;font-weight:700}
textarea{width:100%;min-height:220px;resize:vertical;border:1px solid #d0d5dd;border-radius:12px;padding:12px;font:15px/1.65 ui-monospace,monospace}
[hidden]{display:none!important}
@media(max-width:380px){
 .panel{padding:10px}
 .day{min-height:54px}
 .day .mark{font-size:8px}
 .nav-btn{padding:9px 7px}
}
</style>
</head>
<body>
<main>
<h1>シフト希望作成</h1>
<p class="sub">勤務時間を選んで、出勤できる日をタップしてください。</p>

<section class="panel">
 <div class="month-nav">
  <button class="nav-btn" id="prev">‹ 前月</button>
  <h2 id="monthTitle"></h2>
  <button class="nav-btn" id="next">翌月 ›</button>
 </div>

 <div class="options"></div>

 <div class="custom-form" aria-label="新しい勤務時間を作成">
  <label>開始時刻<input id="customStart" type="time" value="09:00" required></label>
  <label>終了時刻<input id="customEnd" type="time" value="17:00" required></label>
  <label class="checkline full">
   <input id="customLate" type="checkbox" checked>
   終了時刻以降も勤務可能（22:00までOK）
  </label>
  <button class="primary full" id="addShift" type="button">この勤務時間を追加</button>
 </div>

 <p class="hint">勤務時間を選んで日付をタップ。選択済みの日を同じ勤務時間で再度タップすると解除できます。6時間以上の勤務は休憩1時間を控除します。</p>
 <p class="save-note" id="saveStatus" aria-live="polite">入力内容はこの端末に自動保存されます。</p>
</section>

<section class="panel">
 <div class="weekdays">
  <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
 </div>
 <div class="calendar" id="calendar"></div>
 <p class="status" id="status"></p>
 <div class="total-box">
  <p class="total-label">表示中の月の実働時間（休憩控除後）</p>
  <p class="total-hours" id="totalHours">0時間</p>
  <p class="total-detail" id="totalDetail"></p>
 </div>
</section>

<section class="panel actions">
 <button class="primary" id="make">提出用テキストを作成</button>
 <button class="secondary" id="clear">表示中の月の選択を解除</button>
</section>

<section class="panel" id="outputPanel" hidden>
 <h2 style="font-size:18px;margin:0 0 10px">提出用テキスト</h2>
 <textarea id="output" readonly></textarea>
 <button class="primary" id="copy" style="width:100%;margin-top:10px">テキストをコピー</button>
 <p class="status" id="copyStatus" aria-live="polite"></p>
</section>
</main>

<script>
(()=>{
const STORAGE_KEY="shiftGeneratorData_v2";

const defaultShifts=[
 {id:"long",start:"11:00",end:"20:00",late:true,custom:false},
 {id:"afternoon",start:"15:00",end:"20:00",late:true,custom:false},
 {id:"evening",start:"17:00",end:"20:00",late:true,custom:false},
 {id:"earlylong",start:"08:00",end:"20:00",late:true,custom:false},
 {id:"morning5",start:"08:00",end:"13:00",late:false,custom:false},
 {id:"morning",start:"08:00",end:"12:00",late:false,custom:false},
 {id:"morning3",start:"08:00",end:"11:00",late:false,custom:false}
];

const now=new Date();
let viewYear=now.getFullYear(),viewMonth=now.getMonth();
let shiftDefs=defaultShifts.map(x=>({...x}));
let shifts=new Map(),selectedId="long";

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const keyFor=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;

const durationMinutes=def=>{
 const [sh,sm]=def.start.split(":").map(Number);
 const [eh,em]=def.end.split(":").map(Number);
 return eh*60+em-(sh*60+sm);
};

const formatDuration=mins=>{
 const h=Math.floor(mins/60),m=mins%60;
 return m?`${h}時間${m}分`:`${h}時間`;
};

const defFor=id=>shiftDefs.find(x=>x.id===id);

const labelFor=def=>
 `${def.start.replace(/^0/,"")}〜${def.end.replace(/^0/,"")}${def.late?"（22:00までOK）":""}`;

const minutesWorked=def=>
 Math.max(0,durationMinutes(def)-(durationMinutes(def)>=360?60:0));

// 日本の祝日を計算
function japaneseHolidays(year){
 const holidays=new Map();
 const add=(month,day,name)=>
  holidays.set(`${year}-${pad(month)}-${pad(day)}`,name);

 const nthWeekday=(month,weekday,nth)=>{
  const first=new Date(year,month-1,1).getDay();
  return 1+((weekday-first+7)%7)+(nth-1)*7;
 };

 const vernal=Math.floor(20.8431+0.242194*(year-1980)-Math.floor((year-1980)/4));
 const autumn=Math.floor(23.2488+0.242194*(year-1980)-Math.floor((year-1980)/4));

 add(1,1,"元日");
 if(year>=2000)add(1,nthWeekday(1,1,2),"成人の日");
 else add(1,15,"成人の日");

 add(2,11,"建国記念の日");
 if(year>=2020)add(2,23,"天皇誕生日");
 else if(year<=2018)add(12,23,"天皇誕生日");

 add(3,vernal,"春分の日");
 add(4,29,"昭和の日");
 add(5,3,"憲法記念日");

 if(year>=2007)add(5,4,"みどりの日");
 add(5,5,"こどもの日");

 if(year===2020)add(7,23,"海の日");
 else if(year===2021)add(7,22,"海の日");
 else if(year>=2003)add(7,nthWeekday(7,1,3),"海の日");
 else if(year>=1996)add(7,20,"海の日");

 if(year===2020)add(8,10,"山の日");
 else if(year===2021)add(8,8,"山の日");
 else if(year>=2016)add(8,11,"山の日");

 if(year>=2003)add(9,nthWeekday(9,1,3),"敬老の日");
 else add(9,15,"敬老の日");

 add(9,autumn,"秋分の日");

 if(year===2020)add(7,24,"スポーツの日");
 else if(year===2021)add(7,23,"スポーツの日");
 else if(year>=2000)add(10,nthWeekday(10,1,2),"スポーツの日");
 else add(10,10,"体育の日");

 add(11,3,"文化の日");
 add(11,23,"勤労感謝の日");

 // 国民の休日
 for(let day=2;day<=364;day++){
  const date=new Date(year,0,day);
  const key=`${year}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
  const prev=new Date(year,0,day-1);
  const next=new Date(year,0,day+1);
  const prevKey=`${year}-${pad(prev.getMonth()+1)}-${pad(prev.getDate())}`;
  const nextKey=`${year}-${pad(next.getMonth()+1)}-${pad(next.getDate())}`;

  if(!holidays.has(key)&&holidays.has(prevKey)&&holidays.has(nextKey)){
   holidays.set(key,"国民の休日");
  }
 }

 // 振替休日
 for(const [key] of [...holidays.entries()]){
  const [y,m,d]=key.split("-").map(Number);
  if(new Date(y,m-1,d).getDay()!==0)continue;

  let date=new Date(y,m-1,d+1),guard=0;
  while(guard++<10){
   const nextKey=`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
   if(!holidays.has(nextKey)){
    holidays.set(nextKey,"振替休日");
    break;
   }
   date.setDate(date.getDate()+1);
  }
 }
 return holidays;
}

function saveData(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
   shiftDefs,
   shifts:[...shifts.entries()],
   selectedId
  }));
  $("saveStatus").textContent="入力内容はこの端末に自動保存されています。";
 }catch(e){
  $("saveStatus").textContent="自動保存できませんでした。Safariの設定などを確認してください。";
 }
}

function loadData(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw)return;

  const data=JSON.parse(raw);

  // 新しい標準シフトを使い、保存済みの追加シフトは引き継ぐ
  if(Array.isArray(data.shiftDefs)){
   const customDefs=data.shiftDefs.filter(d=>d&&d.custom);
   shiftDefs=[...defaultShifts.map(d=>({...d})),...customDefs];
  }

  if(Array.isArray(data.shifts))shifts=new Map(data.shifts);

  if(data.selectedId&&shiftDefs.some(d=>d.id===data.selectedId)){
   selectedId=data.selectedId;
  }

  // 存在しない勤務時間IDの保存データは除外
  for(const [k,v] of shifts){
   if(!defFor(v))shifts.delete(k);
  }
 }catch(e){
  // 保存データが壊れている場合は初期設定を使用
 }
}

function renderOptions(){
 const box=document.querySelector(".options");
 box.replaceChildren();

 for(const def of shiftDefs){
  const label=document.createElement("label");
  label.className="option";

  const radio=document.createElement("input");
  radio.type="radio";
  radio.name="shift";
  radio.value=def.id;
  radio.checked=def.id===selectedId;
  radio.addEventListener("change",()=>{
   selectedId=def.id;
   saveData();
  });

  const span=document.createElement("span");
  span.className="option-label";
  span.textContent=labelFor(def);

  label.append(radio,span);

  if(def.custom){
   const del=document.createElement("button");
   del.type="button";
   del.className="delete-shift";
   del.textContent="削除";
   del.setAttribute("aria-label",`${labelFor(def)}を削除`);

   del.addEventListener("click",e=>{
    e.preventDefault();
    e.stopPropagation();

    if(!confirm(`勤務時間「${labelFor(def)}」を削除しますか？この勤務時間を選んだ日も未選択になります。`))return;

    shiftDefs=shiftDefs.filter(x=>x.id!==def.id);

    for(const [k,v] of shifts){
     if(v===def.id)shifts.delete(k);
    }

    if(selectedId===def.id)selectedId=shiftDefs[0]?.id||"";

    renderOptions();
    saveData();
    render();
   });

   label.appendChild(del);
  }

  box.appendChild(label);
 }
}

function render(){
 $("monthTitle").textContent=`${viewYear}年${viewMonth+1}月`;

 const grid=$("calendar");
 grid.replaceChildren();

 const offset=(new Date(viewYear,viewMonth,1).getDay()+6)%7;
 const days=new Date(viewYear,viewMonth+1,0).getDate();
 const rows=Math.ceil((offset+days)/7);
 const holidays=japaneseHolidays(viewYear);

 for(let i=0;i<rows*7;i++){
  const day=i-offset+1;
  const cell=document.createElement("button");
  cell.type="button";

  if(day<1||day>days){
   cell.className="day empty";
   cell.tabIndex=-1;
   cell.setAttribute("aria-hidden","true");
  }else{
   const key=keyFor(viewYear,viewMonth,day);
   const id=shifts.get(key);
   const def=defFor(id);
   const date=new Date(viewYear,viewMonth,day);
   const holidayName=holidays.get(key);

   cell.className="day"
    +(date.getDay()===6?" saturday":date.getDay()===0?" sunday":"")
    +(holidayName?" holiday":"")
    +(def?` ${def.custom?"custom":def.id}`:"");

   if(holidayName)cell.title=holidayName;

   const num=document.createElement("span");
   num.className="num";
   num.textContent=day;
   cell.appendChild(num);

   if(def){
    const mark=document.createElement("span");
    mark.className="mark";
    mark.textContent=`${def.start.replace(/^0/,"")}–${def.end.replace(/^0/,"")}`;
    cell.appendChild(mark);
   }

   cell.setAttribute("aria-label",
    `${viewMonth+1}月${day}日${def?"、"+labelFor(def):"、未選択"}`);
   cell.setAttribute("aria-pressed",def?"true":"false");

   cell.addEventListener("click",()=>{
    if(shifts.get(key)===selectedId){
     shifts.delete(key);
    }else{
     shifts.set(key,selectedId);
    }

    $("outputPanel").hidden=true;
    saveData();
    render();
   });
  }

  grid.appendChild(cell);
 }

 const prefix=`${viewYear}-${pad(viewMonth+1)}-`;
 const monthKeys=[...shifts.keys()]
  .filter(k=>k.startsWith(prefix)&&defFor(shifts.get(k)));
 const count=monthKeys.length;

 const totalMinutes=monthKeys.reduce(
  (sum,k)=>sum+minutesWorked(defFor(shifts.get(k))),0
 );

 $("status").textContent=
  `この月の選択：${count}日（全月合計：${[...shifts.keys()].filter(k=>defFor(shifts.get(k))).length}日）`;

 $("totalHours").textContent=formatDuration(totalMinutes);

 const counts=new Map();
 for(const k of monthKeys){
  const id=shifts.get(k);
  counts.set(id,(counts.get(id)||0)+1);
 }

 $("totalDetail").textContent=
  shiftDefs.filter(d=>counts.has(d.id))
   .map(d=>`${labelFor(d)}：${counts.get(d.id)}日 × ${formatDuration(minutesWorked(d))}`)
   .join(" ／ ")
  ||"シフトを選択すると合計が表示されます。";
}

function moveMonth(delta){
 const d=new Date(viewYear,viewMonth+delta,1);
 viewYear=d.getFullYear();
 viewMonth=d.getMonth();
 $("outputPanel").hidden=true;
 render();
}

$("prev").addEventListener("click",()=>moveMonth(-1));
$("next").addEventListener("click",()=>moveMonth(1));

$("addShift").addEventListener("click",()=>{
 const start=$("customStart").value;
 const end=$("customEnd").value;
 const late=$("customLate").checked;

 if(!start||!end){
  alert("開始時刻と終了時刻を入力してください。");
  return;
 }

 if(end<=start){
  alert("終了時刻は開始時刻より後にしてください（翌日にまたぐ勤務には対応していません）。");
  return;
 }

 const candidate={start,end,late};

 if(shiftDefs.some(d=>d.start===start&&d.end===end&&d.late===late)){
  alert("同じ勤務時間はすでに登録されています。");
  return;
 }

 const id="custom_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);

 shiftDefs.push({id,start,end,late,custom:true});
 selectedId=id;

 renderOptions();
 saveData();
 render();

 alert(`「${labelFor(candidate)}」を追加しました。選択した状態なので、カレンダーの日付をタップして使えます。`);
});

$("clear").addEventListener("click",()=>{
 const prefix=`${viewYear}-${pad(viewMonth+1)}-`;

 for(const k of [...shifts.keys()]){
  if(k.startsWith(prefix))shifts.delete(k);
 }

 $("outputPanel").hidden=true;
 saveData();
 render();
});

$("make").addEventListener("click",()=>{
 const prefix=`${viewYear}-${pad(viewMonth+1)}-`;
 const keys=[...shifts.keys()]
  .filter(k=>k.startsWith(prefix)&&defFor(shifts.get(k)))
  .sort();

 if(!keys.length){
  alert("この月の出勤日を先に選択してください。");
  return;
 }

 const lines=[`${viewMonth+1}月シフト`];

 for(const k of keys){
  const day=Number(k.slice(-2));
  const def=defFor(shifts.get(k));

  lines.push(
   `${day} ${def.start}〜${def.end}${def.late?"(22:00までok)":""}`
  );
 }

 // 提出用テキストには合計実働時間を含めない
 $("output").value=lines.join("\n");
 $("outputPanel").hidden=false;
 $("copyStatus").textContent="";
 $("outputPanel").scrollIntoView({behavior:"smooth",block:"start"});
});

$("copy").addEventListener("click",async()=>{
 try{
  await navigator.clipboard.writeText($("output").value);
  $("copyStatus").textContent="コピーしました！LINEなどに貼り付けできます。";
 }catch{
  $("output").focus();
  $("output").select();
  $("copyStatus").textContent="文字を長押ししてコピーしてください。";
 }
});

loadData();
renderOptions();
render();
})();
</script>
</body>
</html>
